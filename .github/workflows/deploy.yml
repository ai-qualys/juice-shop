# Copy this file to your juice-shop fork at:
#   .github/workflows/deploy.yml
#
# It builds a Docker image from your fork and deploys it to the EC2 stack.
# GitHub Secrets required in the fork repo:
#   EC2_HOST      — public IP or hostname of your EC2 instance
#   EC2_USER      — SSH user (ec2-user / ubuntu)
#   EC2_SSH_KEY   — private key matching the instance's authorized_keys

name: Build + Deploy Juice Shop to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:   # allows triggering from the primix deploy workflow

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/juice-shop

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/primix-demo
            echo "${{ secrets.GITHUB_TOKEN }}" \
              | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose pull juice-shop
            docker compose up -d --no-deps juice-shop
            docker image prune -f
